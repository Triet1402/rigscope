name: CI

# Manual verification only. This repository does not run CI on push, pull
# requests, a schedule or from other workflows.
on:
  workflow_dispatch:
    inputs:
      lifecycle:
        description: "Run the full installer lifecycle end-to-end test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ui:
    name: UI typecheck, unit tests and export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: UI unit and contract tests
        run: npm test

      - name: Build the static UI export
        run: npm run build:ui

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website --no-audit --no-fund

      - name: Check shared product demo and SEO
        run: |
          npm run typecheck --prefix website
          npm run verify:demo --prefix website
          npm run build --prefix website
          npm run verify:seo --prefix website

  # Go rewrite (docs/rewrite/PLAN.md): vet, race tests and static
  # cross-builds for every supported architecture.
  go:
    name: Go (vet, race tests, cross-builds)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal scripts)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Check generated protocol fixtures
        run: |
          go generate ./internal/protocol
          git diff --exit-code -- testdata/protocol

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./... -timeout 900s

      - name: Static cross-builds
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/rigscope
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/rigscope
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/rigscope

  # The only runtime implementation is the Go binary with the UI embedded.
  # Build it the way a release does, then run the Go-only runtime harness.
  runtime:
    name: Runtime harness (Go binary)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      RIGSCOPE_TEST_GO_BINARY: ${{ github.workspace }}/rigscope
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"

      - name: Use Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the UI export and embed it
        run: |
          npm run build:ui
          go generate ./internal/hub/webui

      - name: Build the Go binary
        env:
          CGO_ENABLED: "0"
        run: go build -o rigscope ./cmd/rigscope

      - name: Run the Go-only runtime harness
        run: node scripts/test-runtime.cjs

  # Builds the actual release assets with scripts/release/build.sh and runs the
  # artifact verifier. The verifier boots the amd64 binary's hub, checks the
  # arm64/armv7 ELF headers and installs from a local HTTPS server. CI stays
  # manual-only, like every other job in this repository.
  release:
    name: Release artifacts (build and verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"

      - name: Use Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release artifacts
        run: sh scripts/release/build.sh 1.0.0

      - name: Verify release artifacts
        run: sh scripts/release/verify.sh 1.0.0

  # The full installer lifecycle with real release binaries: install.sh ->
  # user-scope install -> enrollment -> upgrade -> rollback -> uninstall, all
  # against fake systemd tools and disposable HOME/XDG directories. Select the
  # "lifecycle" input when dispatching CI to run it; it builds two releases and
  # needs the same build dependencies as the release job.
  lifecycle:
    name: Installer lifecycle e2e (manual)
    if: ${{ inputs.lifecycle }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"

      - name: Use Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run installer lifecycle
        run: sh scripts/e2e/lifecycle.sh
